name: daily-digest

on:
  schedule:
    - cron: '20 22 * * *'  # 22:20 UTC = 北京时间次日早 6:20；避开整点高峰，留出排队余量
  workflow_dispatch:        # 手动触发，方便随时补跑

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m ai_daily.main

      - name: Commit digest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "digest: $(TZ=Asia/Shanghai date +%F)" || echo "nothing to commit"
          git push

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 放在部署之后：降级的页面照常上线，但让本次 run 标红，
      # 触发 GitHub 的 workflow 失败邮件，避免再像 7/25、7/26 那样悄无声息坏掉。
      - name: Alert on degradation
        run: |
          DATE=$(TZ=Asia/Shanghai date +%F)
          python - "$DATE" <<'PY'
          import json, sys
          date = sys.argv[1]
          d = json.load(open(f"data/{date}.json"))
          bad = d.get("degraded")
          if bad is None:  # 兼容旧数据：没有 degraded 字段时看 llm_used
              bad = [] if d.get("llm_used", True) else ["(unknown)"]
          if bad:
              print(f"::error::{date} 日报有板块降级（未经过 LLM 加工）：{', '.join(bad)}")
              sys.exit(1)
          print(f"{date} 全部板块正常加工")
          PY
